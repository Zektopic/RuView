name: Update vendor submodules

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodules to latest tracked branch
        run: |
          git submodule sync --recursive
          git submodule update --remote --recursive

      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for changes and push directly to main
        run: |
          if git diff --quiet; then
            echo "No submodule changes detected — nothing to commit."
          else
            echo "--- submodule pointer changes ---"
            git submodule status --recursive || true
            git diff --submodule=log -- vendor/ || true
            git add vendor/
            git commit -m "chore: update vendor submodules to latest upstream"
            git push origin main
            echo "Submodule updates pushed directly to main."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
